name: Update clean DNS rule sets

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sing-box 1.14.0
        run: |
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar -xz
          mv sing-box-1.14.0-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
      - name: Build domain-only rules
        run: python3 scripts/build.py --sing-box ./sing-box
      - name: Commit updates when upstream changed
        run: |
          git add rules
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update clean DNS rule sets'
          git push
